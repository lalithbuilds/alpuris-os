version: "3.8"

services:
  metropolis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bengaluru-living-metropolis
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - HOST=0.0.0.0
      - TICK_INTERVAL_SEC=3.5
    env_file:
      - path: .env
        required: false
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/state"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
