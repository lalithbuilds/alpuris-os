[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpuris-os"
version = "4.5.0"
description = "ALPURIS OS: Sovereign Living Agent Metropolis Engine. Created by Lalith Alpuri. 100 Autonomous AI Citizens, PIANO Dual-Speed Cognition, 3D Voxel World, Real-World Economy & Stock Market"
readme = "README.md"
authors = [{ name = "Lalith Chandra (Lalith Alpuri)", email = "lalith070804@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "lalith-chandra",
    "lalith-alpuri",
    "lalith-chandra-alpuri",
    "alpuris-os",
    "autonomous-agents",
    "living-agent-metropolis",
    "simulation",
    "multi-agent",
    "threejs",
    "metropolis-os",
    "cognitive-architecture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "playwright>=1.40.0"
]
neural = [
    "fastembed>=0.2.0",
    "numpy>=1.24.0"
]

[project.scripts]
alpuris = "server:run_server"
metropolis = "server:run_server"

[project.urls]
Homepage = "https://github.com/lalithbuilds/alpuris-os"
Repository = "https://github.com/lalithbuilds/alpuris-os"
Documentation = "https://github.com/lalithbuilds/alpuris-os#readme"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["vendor", "sandbox", "temp_storage", ".pytest_cache"]
